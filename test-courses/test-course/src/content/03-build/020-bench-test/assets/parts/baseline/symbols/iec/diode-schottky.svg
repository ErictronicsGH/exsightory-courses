<!-- Schottky diode — the cathode bar with its S hooks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -26 104 52">
  <g data-layer="thermal">
    <rect x="-16" y="-16" width="32" height="32" rx="1" fill="var(--bench-heat)" stroke="none"/>
  </g>
  <g data-layer="flow">
    <line x1="-38.4" y1="0" x2="-13" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38.4" y1="0" x2="13" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-layer="body">
    <polygon points="-13,-14 14,0 -13,14" stroke="var(--bench-symbol)" fill="var(--bench-symbol)" stroke-width="var(--bench-stroke, 2.4)" stroke-linejoin="round"/>
    <line x1="14" y1="-14" x2="14" y2="14" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-38.4" y1="0" x2="-13" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38.4" y1="0" x2="13" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="21,-8 21,-14 14,-14" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="7,14 14,14 14,8" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    <circle data-terminal="a" cx="-38.4" cy="0" r="2.6" fill="var(--bench-terminal)"/>
    <circle data-terminal="k" cx="38.4" cy="0" r="2.6" fill="var(--bench-terminal)"/>
  </g>
  <g data-layer="hitbox">
    <rect x="-52" y="-26" width="104" height="52" fill="currentColor" opacity="0"/>
  </g>
</svg>
