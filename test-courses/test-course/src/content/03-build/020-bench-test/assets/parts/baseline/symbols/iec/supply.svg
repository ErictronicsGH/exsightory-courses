<!-- Bench supply — a source with its polarity marked in strokes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -28 104 56">
  <g data-layer="thermal">
    <circle cx="0" cy="0" r="27.4" fill="var(--bench-heat)" stroke="none"/>
  </g>
  <g data-layer="flow">
    <line x1="-50.8" y1="0" x2="-25.4" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50.8" y1="0" x2="25.4" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-layer="body">
    <circle cx="0" cy="0" r="25.4" stroke="var(--bench-symbol)" fill="var(--bench-sheet)" stroke-width="var(--bench-stroke, 2.4)" stroke-linejoin="round"/>
    <!--
      The polarity, as **two marks and not one**, each read about its own place
      on the face rather than about the centre.

      A supply stood on end is the ordinary case on a sheet, and it is what
      makes this the symbol that proves the rule. The plus survives a quarter
      turn by luck — it is symmetric — but the minus becomes a vertical bar,
      which is not a minus and is read as one anyway. And both have to *travel*:
      the plus belongs beside terminal `p`, so a mark pinned to where this file
      drew it would sit on the left while `p` went to the top, and the drawing
      would then say the wrong pin is positive.
    -->
    <g data-upright="-14 0">
      <line x1="-20.3" y1="0" x2="-7.7" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-14" y1="-6.3" x2="-14" y2="6.3" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g data-upright="14 0">
      <line x1="7.7" y1="0" x2="20.3" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="-50.8" y1="0" x2="-25.4" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50.8" y1="0" x2="25.4" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <circle data-terminal="p" cx="-50.8" cy="0" r="2.6" fill="var(--bench-terminal)"/>
    <circle data-terminal="n" cx="50.8" cy="0" r="2.6" fill="var(--bench-terminal)"/>
  </g>
  <g data-layer="hitbox">
    <rect x="-52" y="-28" width="104" height="56" fill="currentColor" opacity="0"/>
  </g>
</svg>
