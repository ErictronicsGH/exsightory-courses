<!-- Bench supply — a source with its polarity marked in strokes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -26 104 52">
  <g data-layer="thermal">
    <circle cx="0" cy="0" r="22" fill="var(--bench-heat)" stroke="none"/>
  </g>
  <g data-layer="flow">
    <line x1="-45.4" y1="0" x2="-20" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="45.4" y1="0" x2="20" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-layer="body">
    <circle cx="0" cy="0" r="20" stroke="var(--bench-symbol)" fill="var(--bench-sheet)" stroke-width="var(--bench-stroke, 2.4)" stroke-linejoin="round"/>
    <line x1="-16" y1="0" x2="-6" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-11" y1="-5" x2="-11" y2="5" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="0" x2="16" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-45.4" y1="0" x2="-20" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="45.4" y1="0" x2="20" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <circle data-terminal="p" cx="-45.4" cy="0" r="2.6" fill="var(--bench-terminal)"/>
    <circle data-terminal="n" cx="45.4" cy="0" r="2.6" fill="var(--bench-terminal)"/>
  </g>
  <g data-layer="hitbox">
    <rect x="-52" y="-26" width="104" height="52" fill="currentColor" opacity="0"/>
  </g>
</svg>
