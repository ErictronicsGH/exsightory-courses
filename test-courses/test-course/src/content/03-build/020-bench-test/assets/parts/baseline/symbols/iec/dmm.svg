<!-- Handheld multimeter — the round meter face, opaque. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -26 104 52">
  <g data-layer="thermal">
    <circle cx="0" cy="0" r="22" fill="var(--bench-heat)" stroke="none"/>
  </g>
  <g data-layer="flow">
    <line x1="-50.8" y1="0" x2="-20" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50.8" y1="0" x2="20" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-layer="body">
    <circle cx="0" cy="0" r="20" stroke="var(--bench-symbol)" fill="var(--bench-sheet)" stroke-width="var(--bench-stroke, 2.4)" stroke-linejoin="round"/>
    <!--
      The needle, and a **mark** rather than part of the body (owner, 2026-09-03).
      A face is a thing you read: a meter stood on end with its pointer leaning
      the other way reads as a broken instrument rather than a turned one. Read
      about the centre of the face, which is where the face is.
    -->
    <g data-upright="0 0">
      <line x1="-10" y1="9" x2="10" y2="-8" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="-50.8" y1="0" x2="-20" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50.8" y1="0" x2="20" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <circle data-terminal="hi" cx="-50.8" cy="0" r="2.6" fill="var(--bench-terminal)"/>
    <circle data-terminal="lo" cx="50.8" cy="0" r="2.6" fill="var(--bench-terminal)"/>
  </g>
  <g data-layer="hitbox">
    <rect x="-52" y="-26" width="104" height="52" fill="currentColor" opacity="0"/>
  </g>
</svg>
