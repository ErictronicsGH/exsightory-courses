<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dummy load calculator</title>
<style>
  :root {
    --ink: #0E141A; --surface: #121A22; --raised: #18222C;
    --border: #24303C; --text: #D4DEE8; --muted: #7A8A9A;
    --amber: #D4A017; --teal: #1FB8A6; --red: #C24B3F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--ink); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: .01em; }
  p.lede { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 14px; margin-bottom: 14px; }
  label { flex: 1; display: block; }
  span.name { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px;
              text-transform: uppercase; letter-spacing: .06em; }
  input {
    width: 100%; padding: 9px 11px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; font: inherit;
    font-variant-numeric: tabular-nums;
  }
  input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .out { background: var(--raised); border: 1px solid var(--border);
         border-radius: 6px; padding: 14px 16px; }
  .line { display: flex; justify-content: space-between; align-items: baseline;
          padding: 7px 0; border-bottom: 1px solid var(--border); }
  .line:last-child { border-bottom: 0; }
  .line b { font-size: 19px; font-variant-numeric: tabular-nums; }
  .teal { color: var(--teal); } .amber { color: var(--amber); }
  .warn { margin-top: 12px; padding: 10px 12px; border-radius: 5px;
          background: rgb(194 75 63 / 14%); border: 1px solid var(--red);
          color: var(--text); font-size: 13px; }
  .warn[hidden] { display: none; }
</style>
</head>
<body>
  <h1>Dummy load calculator</h1>
  <p class="lede">Work out the resistance and, more importantly, the wattage.</p>

  <div class="row">
    <label><span class="name">Voltage (V)</span>
      <input id="v" type="number" value="12" min="0" step="0.1"></label>
    <label><span class="name">Target current (A)</span>
      <input id="i" type="number" value="0.5" min="0" step="0.05"></label>
  </div>

  <div class="out">
    <div class="line"><span>Resistance needed</span><b class="teal" id="r">—</b></div>
    <div class="line"><span>Power in the resistor</span><b class="amber" id="p">—</b></div>
    <div class="line"><span>Choose a resistor rated at least</span><b id="rating">—</b></div>
  </div>

  <div class="warn" id="warn" hidden></div>

<!--
  External, not inline.

  Course content is served with `script-src 'self'` (security baseline 2.3), which
  refuses an inline script. That is deliberate and it is not going to change, so a
  widget keeps its code in a file beside it. Found when M04's audience window
  first framed this widget for real.
-->
<script src="widget.js"></script>
</body>
</html>
