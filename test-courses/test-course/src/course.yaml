# A course invented to exercise the player.
#
# Nothing here is real teaching material. It exists to give the compiler and the
# app one of everything — every block type, every canvas kind, a glossary in all
# three shapes, local and shared assets, and a model that arrives as an STL and
# leaves as a GLB.
#
# It is deliberately NOT the first delivery's content. The player must never
# depend on any one course, and `generic.test.ts` fails the build if it starts to.
id: bench-psu
title: Designing a Bench Power Supply
subtitle: An invented course used to exercise the INSIGHT player
version: 1.0.0
languages: [en]

tutor:
  name: Dr Ada Fenwick
  photo: tutor/photo.png
  bio:
    en: tutor/bio.en.md

# The course's picture, for the library card and a listing (M42ae). Drawn, not
# photographed — a fixture carries nothing real. Relative to this folder.
cover: shared-assets/cover.png

footer: The Fenwick Institute for Applied Electronics

# Who the course is for, in a sentence (M63c): the frame the Authoring
# Compiler reads every suggestion against.
audience: First-year electronics students who know Ohm's law and have never designed a supply.

# What the course teaches, declared once (M63c). A subsection names the
# concepts it serves in its frontmatter; its blocks inherit them unless one
# narrows its own. 030-smoothing does both: it serves two, its opening paragraph
# narrows to one and its figure to the other, and the analogy between inherits.
concepts:
  - id: step-down
    label: Stepping the mains down
  - id: rectification
    label: Rectification
    prerequisites: [step-down]
  - id: ripple
    label: Ripple
    prerequisites: [rectification]
  - id: reservoir-capacitor
    label: Sizing a reservoir capacitor
    prerequisites: [ripple]
  - id: linear-regulation
    label: Linear regulation
    prerequisites: [ripple]
  - id: current-limiting
    label: Current limiting
    prerequisites: [linear-regulation]

# Chapters, not days. This course could be an afternoon or a term; the player
# must not care, and the calendar belongs to the Offering (§12.2).
chapters:
  - id: 01-raw-dc
    title: 'Part 1: From the wall to raw DC'
    order: 1
    scheduledMinutes: 75
    ads: []
  - id: 02-regulation
    title: 'Part 2: Regulation and protection'
    order: 2
    scheduledMinutes: 60
    ads: []
  - id: 03-build
    title: 'Part 3: Building and testing the unit'
    order: 3
    # 90 for the build, and 40 more for the exam that closes it (M17c).
    scheduledMinutes: 130
    ads: []
