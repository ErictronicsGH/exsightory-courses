# A course invented to exercise the player.
#
# Nothing here is real teaching material. It exists to give the compiler and the
# app one of everything — every block type, every canvas kind, a glossary in all
# three shapes, local and shared assets, and a model that arrives as an STL and
# leaves as a GLB.
#
# It is deliberately NOT the first delivery's content. The player must never
# depend on any one course, and `generic.test.ts` fails the build if it starts to.
id: bench-psu
# The details page draws the marked words in the wordmark's inks (M64); every
# other reader gets the words alone.
title: "Designing a [Bench]{color=amber} [Power Supply]{color=teal}"
subtitle: An invented course used to exercise the INSIGHT player
version: 1.0.0
languages: [en]

tutor:
  name: Dr Ada Fenwick
  photo: tutor/photo.png
  bio:
    en: tutor/bio.en.md
  # The details page's few lines (M64): written for it, at most 200 characters.
  shortBio: >-
    Ada has designed bench supplies for twenty years and runs the Institute's
    first-year electronics lab. An invented author, for an invented course.
  # How to reach the author, on the course outro (M52b, crossing 805): drawn as
  # text, never a link. The platform's address and no other (no off-platform
  # contact, owner 2026-09-30): the course's own page, where its messages are.
  contact: exsightory.com/courses/bench-psu

# The picture behind the details page's title (M64): 2400 × 500, one per theme,
# cut from the owner's two lab photographs at exactly the window his course
# details pictures show them through. The authors' sample (`standards/course-banner.md`).
banner:
  dark: shared-assets/banner-dark.webp
  light: shared-assets/banner-light.webp

# The course's picture, for the library card and a listing (M42ae). Drawn, not
# photographed — a fixture carries nothing real. Relative to this folder.
cover: shared-assets/cover.png

footer: The Fenwick Institute for Applied Electronics

# What the author says on the course outro, after the last beat (M52b, crossing
# 805): a few lines for the room, at most 200 characters, beside the contact.
outro:
  closing: >-
    Thank you for building this supply with me. Keep it on your bench, and
    measure before you trust it.

# Who the course is for, in a sentence (M63c): the frame the Authoring
# Compiler reads every suggestion against.
audience: First-year electronics students who know Ohm's law and have never designed a supply.

# How the course is meant to be delivered (M65a): from two screens, or from the
# presenter's own one. Not a board, where the Flow in 010-transformer could not
# be read live; the audit would list it.
delivery: [multi-screen, single-screen]

# How the course certifies (M57b): a pass on the weighted score earns the graded
# certificate, and taking part without passing earns the participation one. One
# of every selection: sections, attendance, a role, a practice, a block by its
# section and stable id, and the predictions, which weigh nothing unless named.
certification:
  kind: graded-or-participation
  participation:
    sections: [01-raw-dc-transformer, 03-build-wrap-up]
    attendance: { atLeast: 4, of: 5 }
    answered:
      - role: checkpoint
        atLeast: 2
      - block: 03-build-wrap-up/b-29d8bac0 # the exit survey
  graded:
    threshold: 0.6
    components:
      - role: accuracy
        weight: 0.6
      - practice: computational-thinking
        weight: 0.2
      - block: 03-build-bench-test/b-d2f7cf52 # where to measure
        weight: 0.1
      - role: prediction
        weight: 0.1

# What the course teaches, declared once (M63c). A subsection names the
# concepts it serves in its frontmatter; its blocks inherit them unless one
# narrows its own. 030-smoothing does both: it serves two, its opening paragraph
# narrows to one and its figure to the other, and the analogy between inherits.
concepts:
  - id: step-down
    label: Stepping the mains down
  - id: rectification
    label: Rectification
    prerequisites: [step-down]
  - id: ripple
    label: Ripple
    prerequisites: [rectification]
  - id: reservoir-capacitor
    label: Sizing a reservoir capacitor
    prerequisites: [ripple]
  - id: linear-regulation
    label: Linear regulation
    prerequisites: [ripple]
  - id: current-limiting
    label: Current limiting
    prerequisites: [linear-regulation]

# Chapters, not days. This course could be an afternoon or a term; the player
# must not care, and the calendar belongs to the Offering (§12.2).
chapters:
  - id: 01-raw-dc
    title: 'Part 1: From the wall to raw DC'
    summary: Understand the mains input and how to obtain a stable DC source.
    order: 1
    scheduledMinutes: 75
    ads: []
  - id: 02-regulation
    title: 'Part 2: Regulation and protection'
    summary: Design the regulation stage and add essential protection features.
    order: 2
    scheduledMinutes: 60
    ads: []
  - id: 03-build
    title: 'Part 3: Building and testing the unit'
    summary: Assemble, test, and evaluate the complete bench power supply.
    order: 3
    # 90 for the build, and 40 more for the exam that closes it (M17c).
    scheduledMinutes: 130
    ads: []
