<!-- Inductor — four turns of a coil, as IEC 60617 draws it and EveryCircuit does (M66o-ii). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -26 104 52">
  <g data-layer="thermal">
    <rect x="-25.4" y="-9" width="50.8" height="12" fill="var(--bench-heat)" stroke="none"/>
  </g>
  <g data-layer="flow">
    <line x1="-50.8" y1="0" x2="-25.4" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-25.4,0 a6.35,6.35 0 0 1 12.7,0 a6.35,6.35 0 0 1 12.7,0 a6.35,6.35 0 0 1 12.7,0 a6.35,6.35 0 0 1 12.7,0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50.8" y1="0" x2="25.4" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-layer="body">
    <line x1="-50.8" y1="0" x2="-25.4" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-25.4,0 a6.35,6.35 0 0 1 12.7,0 a6.35,6.35 0 0 1 12.7,0 a6.35,6.35 0 0 1 12.7,0 a6.35,6.35 0 0 1 12.7,0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50.8" y1="0" x2="25.4" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <circle data-terminal="a" cx="-50.8" cy="0" r="2.6" fill="var(--bench-terminal)"/>
    <circle data-terminal="b" cx="50.8" cy="0" r="2.6" fill="var(--bench-terminal)"/>
  </g>
  <g data-layer="hitbox">
    <rect x="-52" y="-26" width="104" height="52" fill="currentColor" opacity="0"/>
  </g>
</svg>
