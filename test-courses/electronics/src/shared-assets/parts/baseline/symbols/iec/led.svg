<!-- LED — a diode with the two emission arrows, at 45°, pointing away. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -26 104 52">
  <g data-layer="thermal">
    <rect x="-16" y="-16" width="32" height="32" rx="1" fill="var(--bench-heat)" stroke="none"/>
  </g>
  <g data-layer="flow">
    <line x1="-38.1" y1="0" x2="-12.7" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38.1" y1="0" x2="12.7" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-layer="body">
    <polygon points="-12.7,-14 12.7,0 -12.7,14" stroke="var(--bench-symbol)" fill="var(--bench-symbol)" stroke-width="var(--bench-stroke, 2.4)" stroke-linejoin="round"/>
    <line x1="12.7" y1="-14" x2="12.7" y2="14" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-38.1" y1="0" x2="-12.7" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38.1" y1="0" x2="12.7" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-1" y1="-19" x2="10" y2="-30" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="12,-32 3,-29 9,-23" fill="var(--bench-symbol)" stroke="none"/>
    <line x1="9" y1="-13" x2="20" y2="-24" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="22,-26 13,-23 19,-17" fill="var(--bench-symbol)" stroke="none"/>
    <circle data-terminal="a" cx="-38.1" cy="0" r="2.6" fill="var(--bench-terminal)"/>
    <circle data-terminal="k" cx="38.1" cy="0" r="2.6" fill="var(--bench-terminal)"/>
  </g>
  <!--
    Where the light comes from, and how far the halo reaches: a quarter pitch
    past the body and one more pitch, which is EveryCircuit's 1¼ pitches from
    its edge. Read by the bench and never painted (M66b-ii-b-iii).
  -->
  <g data-layer="light">
    <circle cx="0" cy="0" r="48" fill="none" stroke="none"/>
  </g>
  <g data-layer="hitbox">
    <rect x="-52" y="-26" width="104" height="52" fill="currentColor" opacity="0"/>
  </g>
</svg>
