<!-- Function generator — a source whose face carries one cycle of a sine, IEC 60617's mark for an alternating source. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -28 104 56">
  <g data-layer="thermal">
    <circle cx="0" cy="0" r="27.4" fill="var(--bench-heat)" stroke="none"/>
  </g>
  <g data-layer="flow">
    <line x1="-50.8" y1="0" x2="-25.4" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50.8" y1="0" x2="25.4" y2="0" stroke="var(--bench-flow)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-layer="body">
    <circle cx="0" cy="0" r="25.4" stroke="var(--bench-symbol)" fill="var(--bench-sheet)" stroke-width="var(--bench-stroke, 2.4)" stroke-linejoin="round"/>
    <!--
      One cycle, held level about the centre (`data-upright`) whichever way the part is turned: a sine standing on end
      reads as a squiggle, and level it is the alternating source every schematic draws. Two cubic halves, the usual
      drawing of a sine on a source.
    -->
    <g data-upright="0 0">
      <path d="M -15.2 0 C -11.4 -14 -3.8 -14 0 0 C 3.8 14 11.4 14 15.2 0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- the output lead's mark, beside terminal p, as the supply's plus: which end is the signal -->
    <g data-upright="-14 -14">
      <line x1="-18" y1="-14" x2="-10" y2="-14" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-14" y1="-18" x2="-14" y2="-10" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke-mark, 1.6)" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="-50.8" y1="0" x2="-25.4" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50.8" y1="0" x2="25.4" y2="0" stroke="var(--bench-symbol)" fill="none" stroke-width="var(--bench-stroke, 2.4)" stroke-linecap="round" stroke-linejoin="round"/>
    <circle data-terminal="p" cx="-50.8" cy="0" r="2.6" fill="var(--bench-terminal)"/>
    <circle data-terminal="n" cx="50.8" cy="0" r="2.6" fill="var(--bench-terminal)"/>
  </g>
  <g data-layer="hitbox">
    <rect x="-52" y="-28" width="104" height="56" fill="currentColor" opacity="0"/>
  </g>
</svg>
