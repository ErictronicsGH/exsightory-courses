# The second instance of `standards/bench-fixture-courses.md`: one bench's
# drawings and nothing else, so driving one drawing loads one drawing's worth of
# course. `test-course/` keeps the one drawing that proves the format; this is
# where the bench is driven.
#
# Every drawing here is hand-written: parametric shapes, and one short path (the
# meter's pointer). Real art, imported from SVG, arrives with `M59b`.
#
# Zero warnings is correct for this course.
