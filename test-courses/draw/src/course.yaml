# The Draw Bench's own driving course (M59a).
#
# The second instance of `standards/bench-fixture-courses.md`: one bench's
# drawings and nothing else, so driving one drawing loads one drawing's worth of
# course. `test-course/` keeps the one drawing that proves the format; this is
# where the bench is driven.
#
# The first four drawings are hand-written: parametric shapes, and one short path (the
# meter's pointer). `030-imported` holds three drawn in LibreOffice Draw and imported
# from SVG (M59b); their sources, and the script that made them, are in `../svg/`.
# `040-function-shapes` holds two drawn from equations with `insight-draw shape`
# (M59p), and the meter's hairspring is a third. `050-picture` holds a dial
# photographed as a PNG beside the drawing, with a pointer drawn over it (M59r):
# the picture the compiler packages and the hosts' drives read off the screen.
# Every drawing is a `bench` fence of one bench-draw version (a `drawing` fence
# still compiles to 0.1.3, before pictures), its entry in bench-catalogue.json.
#
# Zero errors. Nine warnings, all from audit rules newer than the course (no
# objectives or learner action in 010-040, no delivery:); nothing else is correct.
id: bench-draw
title: The Draw Bench
subtitle: Line art for teaching, drawn one step at a time

version: 1.0.0
languages: [en]

tutor:
  name: Erictronics Systems

footer: Every drawing here is made in front of you, one step at a time.

# One chapter, grouped by what a drawing demonstrates, as the electronics
# bench's is.
chapters:
  - id: draw
    title: The Draw Bench
    order: 1
    ads: []
