<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Eye to brain: contact sheet</title><style>:root{color-scheme:dark} body{margin:0;padding:16px;background:#05070B;color:#E6EDF5;font-family:'Segoe UI',system-ui,sans-serif} h1{font-size:20px;margin:4px 0 14px} .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}figure{margin:0;background:#0B0F16;border:1px solid #1C2430;border-radius:10px;overflow:hidden} img{width:100%;display:block}figcaption{padding:8px 12px;font-size:13px;color:#8B97A8} b{color:#E6EDF5}</style></head><body><h1>The eye and the visual pathway, 2D: contact sheet (stills for approval)</h1><div class='g'><figure><img src='contact/stop-00.png' alt='0 · Meet the eye'><figcaption><b>0 · Meet the eye</b><br><i>the eye receiving light from an object</i></figcaption></figure><figure><img src='contact/stop-01.png' alt='1 · Light carries information'><figcaption><b>1 · Light carries information</b><br><i>The light carries information about the environment.</i></figcaption></figure><figure><img src='contact/stop-02.png' alt='2 · Cornea and lens focus the light'><figcaption><b>2 · Cornea and lens focus the light</b><br><i>The cornea and lens work together to focus incoming light onto the retina.</i></figcaption></figure><figure><img src='contact/stop-03.png' alt='3 · An image on the retina'><figcaption><b>3 · An image on the retina</b><br><i>…onto the retina.</i></figcaption></figure><figure><img src='contact/stop-04.png' alt='4 · Photoreceptors turn light into signals'><figcaption><b>4 · Photoreceptors turn light into signals</b><br><i>photoreceptors, which respond to the light and start neural signals</i></figcaption></figure><figure><img src='contact/stop-05.png' alt='5 · The optic nerve carries the signals'><figcaption><b>5 · The optic nerve carries the signals</b><br><i>These signals travel through the optic nerve and other parts of the visual pathway…</i></figcaption></figure><figure><img src='contact/stop-06.png' alt='6 · The visual cortex interprets'><figcaption><b>6 · The visual cortex interprets</b><br><i>…to the areas of the brain involved in vision. What we see is not simply the light itself.</i></figcaption></figure><figure><img src='contact/stop-07.png' alt='7 · When the focus is wrong'><figcaption><b>7 · When the focus is wrong</b><br><i>if the optical system of the eye does not focus the light properly onto the retina</i></figcaption></figure><figure><img src='contact/stop-08.png' alt='8 · When the retina is affected'><figcaption><b>8 · When the retina is affected</b><br><i>or if the retina or other parts of the eye are affected</i></figcaption></figure><figure><img src='contact/stop-09a.png' alt='9a · Three places it can be spoiled · the organ (1 of 3)'><figcaption><b>9a · Three places it can be spoiled · the organ (1 of 3)</b><br><i>the sense organ itself can introduce problems (card 4)</i></figcaption></figure><figure><img src='contact/stop-09b.png' alt='9b · Three places it can be spoiled · the pathway (2 of 3)'><figcaption><b>9b · Three places it can be spoiled · the pathway (2 of 3)</b><br><i>The transmission pathway can also introduce problems (card 4)</i></figcaption></figure><figure><img src='contact/stop-09c.png' alt='9c · Three places it can be spoiled · the processor (3 of 3)'><figcaption><b>9c · Three places it can be spoiled · the processor (3 of 3)</b><br><i>the processing system can introduce problems (card 4)</i></figcaption></figure><figure><img src='contact/stop-10.png' alt='10 · Seeing is not knowing'><figcaption><b>10 · Seeing is not knowing</b><br><i>The child may see the object, but simply seeing it does not mean the child knows what it is called…</i></figcaption></figure><figure><img src='contact/stop-11.png' alt='11 · Learning links the senses'><figcaption><b>11 · Learning links the senses</b><br><i>“This is called sugar” … How does it taste? How does it smell? How does it feel? Does it make a sound?</i></figcaption></figure><figure><img src='contact/stop-12.png' alt='12 · Recognising it next time'><figcaption><b>12 · Recognising it next time</b><br><i>the next time … the brain can draw on that experience to recognise it and anticipate some of its properties</i></figcaption></figure><figure><img src='contact/stop-13.png' alt='13 · The eye as a measurement system'><figcaption><b>13 · The eye as a measurement system</b><br><i>a simplified way of thinking about how humans interface with our environment (the ANALOGY)</i></figcaption></figure><figure><img src='contact/stop-zoomed-out.png' alt='Zoomed out'><figcaption><b>Zoomed out</b><br><i>zoom out from any stop: the whole scene</i></figcaption></figure></div></body></html>
